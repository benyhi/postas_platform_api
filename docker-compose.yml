services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLATFORM_POSTGRES_DB:-postas_platform}
      POSTGRES_USER: ${PLATFORM_POSTGRES_USER:-postas_platform}
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-postas_platform_local}
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python -m alembic upgrade head &&
             python scripts/seed_billing.py &&
             uvicorn main:app --host 0.0.0.0 --port 8001 --reload"
    environment:
      APP_NAME: ${APP_NAME:-Postas Platform API}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql+psycopg://${PLATFORM_POSTGRES_USER:-postas_platform}:${PLATFORM_POSTGRES_PASSWORD:-postas_platform_local}@db:5432/${PLATFORM_POSTGRES_DB:-postas_platform}}
      POSTAS_SERVICE_TOKEN: ${POSTAS_SERVICE_TOKEN:-}
      POSTAS_SERVICE_TOKEN_HEADER: ${POSTAS_SERVICE_TOKEN_HEADER:-X-Postas-Service-Token}
      POSTAS_SERVICE_SOURCE_HEADER: ${POSTAS_SERVICE_SOURCE_HEADER:-X-Postas-Source}
      POSTAS_INTERNAL_REQUIRE_TLS: ${POSTAS_INTERNAL_REQUIRE_TLS:-true}
      ARCA_CREDENTIAL_MASTER_KEYS: ${ARCA_CREDENTIAL_MASTER_KEYS:-}
      ARCA_CREDENTIAL_ACTIVE_KEY_ID: ${ARCA_CREDENTIAL_ACTIVE_KEY_ID:-}
      ARCA_PRODUCTION_CALLS_ENABLED: ${ARCA_PRODUCTION_CALLS_ENABLED:-false}
      ARCA_TIMEOUT_SECONDS: ${ARCA_TIMEOUT_SECONDS:-30}
      ARCA_WORKER_POLL_SECONDS: ${ARCA_WORKER_POLL_SECONDS:-5}
      ARCA_WORKER_BATCH_SIZE: ${ARCA_WORKER_BATCH_SIZE:-20}
      ARCA_CONSUMER_FINAL_IDENTIFICATION_THRESHOLD: ${ARCA_CONSUMER_FINAL_IDENTIFICATION_THRESHOLD:-10000000}
      MERCADO_PAGO_CLIENT_ID: ${MERCADO_PAGO_CLIENT_ID:-}
      MERCADO_PAGO_CLIENT_SECRET: ${MERCADO_PAGO_CLIENT_SECRET:-}
      MERCADO_PAGO_REDIRECT_URI: ${MERCADO_PAGO_REDIRECT_URI:-}
      MERCADO_PAGO_API_BASE_URL: ${MERCADO_PAGO_API_BASE_URL:-https://api.mercadopago.com}
      MERCADO_PAGO_AUTH_BASE_URL: ${MERCADO_PAGO_AUTH_BASE_URL:-https://auth.mercadopago.com}
      MERCADO_PAGO_PLATFORM_ID: ${MERCADO_PAGO_PLATFORM_ID:-}
      MERCADO_PAGO_APPLICATION_ID: ${MERCADO_PAGO_APPLICATION_ID:-}
      MERCADO_PAGO_INTEGRATOR_ID: ${MERCADO_PAGO_INTEGRATOR_ID:-}
      MERCADO_PAGO_CONNECT_TIMEOUT_SECONDS: ${MERCADO_PAGO_CONNECT_TIMEOUT_SECONDS:-5}
      MERCADO_PAGO_READ_TIMEOUT_SECONDS: ${MERCADO_PAGO_READ_TIMEOUT_SECONDS:-20}
      MERCADO_PAGO_WRITE_TIMEOUT_SECONDS: ${MERCADO_PAGO_WRITE_TIMEOUT_SECONDS:-20}
      MERCADO_PAGO_OAUTH_STATE_TTL_SECONDS: ${MERCADO_PAGO_OAUTH_STATE_TTL_SECONDS:-600}
      MERCADO_PAGO_REFRESH_SKEW_SECONDS: ${MERCADO_PAGO_REFRESH_SKEW_SECONDS:-300}
      MERCADO_PAGO_CREDENTIAL_MASTER_KEYS: ${MERCADO_PAGO_CREDENTIAL_MASTER_KEYS:-}
      MERCADO_PAGO_CREDENTIAL_ACTIVE_KEY_ID: ${MERCADO_PAGO_CREDENTIAL_ACTIVE_KEY_ID:-}
      POSTAS_AI_API_TOKEN: ${POSTAS_AI_API_TOKEN:-}
      REQUIRE_API_TOKEN: ${REQUIRE_API_TOKEN:-false}
      POSTAS_AI_TOKEN_HEADER: ${POSTAS_AI_TOKEN_HEADER:-X-Postas-AI-Token}
      POSTAS_AI_SOURCE_HEADER: ${POSTAS_AI_SOURCE_HEADER:-X-Postas-Source}
      ALLOWED_REQUEST_SOURCES: ${ALLOWED_REQUEST_SOURCES:-}
      AI_PROVIDER: ${AI_PROVIDER:-google_genai}
      FALLBACK_AI_PROVIDER: ${FALLBACK_AI_PROVIDER:-}
      MAX_AI_ATTEMPTS: ${MAX_AI_ATTEMPTS:-1}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.5-flash-lite}
      IMAGE_DOWNLOAD_TIMEOUT_SECONDS: ${IMAGE_DOWNLOAD_TIMEOUT_SECONDS:-15}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      ACCEPTED_CONFIDENCE_THRESHOLD: ${ACCEPTED_CONFIDENCE_THRESHOLD:-0.85}
      MINIMUM_CONFIDENCE_THRESHOLD: ${MINIMUM_CONFIDENCE_THRESHOLD:-0.60}
      INPUT_TOKEN_COST_PER_MILLION: ${INPUT_TOKEN_COST_PER_MILLION:-0}
      OUTPUT_TOKEN_COST_PER_MILLION: ${OUTPUT_TOKEN_COST_PER_MILLION:-0}
    ports:
      - "${API_PORT:-8001}:8001"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=2).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  arca_worker:
    build: .
    command: python -m app.arca.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql+psycopg://${PLATFORM_POSTGRES_USER:-postas_platform}:${PLATFORM_POSTGRES_PASSWORD:-postas_platform_local}@db:5432/${PLATFORM_POSTGRES_DB:-postas_platform}}
      ARCA_CREDENTIAL_MASTER_KEYS: ${ARCA_CREDENTIAL_MASTER_KEYS:-}
      ARCA_CREDENTIAL_ACTIVE_KEY_ID: ${ARCA_CREDENTIAL_ACTIVE_KEY_ID:-}
      ARCA_PRODUCTION_CALLS_ENABLED: ${ARCA_PRODUCTION_CALLS_ENABLED:-false}
      ARCA_TIMEOUT_SECONDS: ${ARCA_TIMEOUT_SECONDS:-30}
      ARCA_WORKER_POLL_SECONDS: ${ARCA_WORKER_POLL_SECONDS:-5}
      ARCA_WORKER_BATCH_SIZE: ${ARCA_WORKER_BATCH_SIZE:-20}
      ARCA_CONSUMER_FINAL_IDENTIFICATION_THRESHOLD: ${ARCA_CONSUMER_FINAL_IDENTIFICATION_THRESHOLD:-10000000}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  platform_postgres_data:
